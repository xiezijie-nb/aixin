<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>爱心提示弹窗</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{
            width:100vw;
            height:100vh;
            overflow:hidden;
        }
        /* 开场封面 */
        .start-page{
            position:fixed;
            inset:0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 25%, #fecfef 50%, #a8edea 100%);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            z-index:99999;
        }
        .enter-btn{
            padding:14px 40px;
            font-size:18px;
            font-weight:bold;
            color:#fff;
            background:rgba(255,255,255,0.3);
            border:2px solid #fff;
            border-radius:30px;
            cursor:pointer;
            transition:all 0.3s;
            backdrop-filter:blur(6px);
        }
        .enter-btn:hover{
            background:rgba(255,255,255,0.5);
            transform:scale(1.05);
        }
        /* 动画主体页面 */
        .main-page{
            width:100%;
            height:100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 25%, #fecfef 50%, #a8edea 100%);
            display:none;
        }
        .heart-window{
            position:absolute;
            width:130px;
            height:46px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:16px;
            font-weight:bold;
            color:#222;
            border-radius:10px;
            box-shadow:0 3px 8px rgba(0,0,0,0.15);
            opacity:0;
            transform:scale(0.4);
            animation:popIn 0.3s ease forwards;
        }
        @keyframes popIn{
            to{
                opacity:1;
                transform:scale(1);
            }
        }
    </style>
</head>
<body>
<!-- 点击开始界面 -->
<div class="start-page">
    <button class="enter-btn">点击进入</button>
</div>

<!-- 动画主界面 -->
<div class="main-page"></div>

<script>
const startPage = document.querySelector('.start-page');
const mainPage = document.querySelector('.main-page');
const enterBtn = document.querySelector('.enter-btn');

enterBtn.addEventListener('click',()=>{
    startPage.style.display = 'none';
    mainPage.style.display = 'block';
    startAnim();
});

function startAnim(){
const w=innerWidth,h=innerHeight,cx=w/2,cy=h/2;
const TIPS=['少熬夜','好好学习','按时吃饭','别分心','你最棒','加油','看好你','记得想我'];
const COLORS=['lightpink','skyblue','lightgreen','lavender','lightyellow','plum'];

function getHeartPoints(total){
    const scale=Math.min(w,h)/28;
    let arr=[];
    for(let i=0;i<total;i++){
        let t=i/total*Math.PI*2;
        let x=16*Math.pow(Math.sin(t),3);
        let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        arr.push([x*scale+cx,-y*scale+cy]);
    }
    return arr;
}

function createEl(x,y){
    let div=document.createElement('div');
    div.className='heart-window';
    div.style.left=x-65+'px';
    div.style.top=y-23+'px';
    div.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
    div.innerText=TIPS[Math.floor(Math.random()*TIPS.length)];
    mainPage.appendChild(div);
}

function run(list,i=0){
    if(i>=list.length)return;
    createEl(...list[i]);
    setTimeout(()=>run(list,i+1),70);
}
run(getHeartPoints(50));
}
</script>
</body>
</html>
