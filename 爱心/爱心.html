<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>爱心提示</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; }
        .start {
            position:fixed; left:0; top:0; width:100%; height:100%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            display:flex; align-items:center; justify-content:center; z-index:9999;
            flex-direction:column; gap:25px;
        }
        .btn {
            padding:16px 45px; font-size:18px; color:#fff;
            background:rgba(255,255,255,0.3); border:2px solid #fff;
            border-radius:50px; cursor:pointer;
            outline:none; -webkit-tap-highlight-color:transparent;
        }
        .loading-tip{
            font-size:16px; color:#fff; display:none;
        }
        .main {
            width:100%; height:100%; position:relative;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            display:none;
        }
        .box {
            position:absolute;
            width:150px; height:50px;
            display:flex; align-items:center; justify-content:center;
            font-size:18px; font-weight:bold; color:#222;
            border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }
        audio { display:none; }
    </style>
</head>
<body>
<!-- 长音频预加载配置，适配3分钟音乐缓冲 -->
<audio id="bgm" loop preload="metadata">
    <source src="6.mp3" type="audio/mpeg">


<div class="start">
    <button class="btn">点击进入</button>
    <div class="loading-tip">音频加载中，请稍候...</div>
</div>
<div class="main"></div>

<script>
var start = document.querySelector('.start');
var main = document.querySelector('.main');
var btn = document.querySelector('.btn');
var bgm = document.getElementById('bgm');
var loadingTip = document.querySelector('.loading-tip');

// 页面初始化预加载长音频资源
bgm.load();
var tips = ['少熬夜','好好学习','按时吃饭','别分心','你最棒','加油','记得想我','平安喜乐','万事顺遂'];
var colors = ['lightpink','skyblue','lightgreen','lavender','lightyellow','plum'];

// 等待音频就绪再进入动画，保障长音乐流畅
function startPlay(){
    btn.style.display = 'none';
    loadingTip.style.display = 'block';
    bgm.volume = 0.4;

    // 监听音频可播放后再切换页面
    bgm.oncanplaythrough = function(){
        setTimeout(function(){
            start.style.display = 'none';
            main.style.display = 'block';
            drawHeart();
        },300);
    }
    bgm.play().catch(function(){});
}

btn.onclick = startPlay;
btn.ontouchstart = startPlay;

function drawHeart(){
    main.innerHTML = '';
    var w = window.innerWidth;
    var h = window.innerHeight;
    var cx = w / 2;
    var cy = h / 2;
    var scale = Math.min(w,h) / 28;
    var points = [];

    for(var i=0;i<45;i++){
        var t = i/45 * Math.PI*2;
        var x = 16 * Math.pow(Math.sin(t),3);
        var y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        points.push([x*scale+cx, -y*scale+cy]);
    }

    var idx = 0;
    function show(){
        if(idx >= points.length){
            setTimeout(drawHeart,3000);
            return;
        }
        var pos = points[idx];
        var div = document.createElement('div');
        div.className = 'box';
        div.style.left = pos[0] - 75 + 'px';
        div.style.top = pos[1] - 25 + 'px';
        div.style.background = colors[Math.floor(Math.random()*colors.length)];
        div.innerText = tips[Math.floor(Math.random()*tips.length)];
        main.appendChild(div);
        idx++;
        setTimeout(show,70);
    }
    show();
}
</script>
</body>
</html>
