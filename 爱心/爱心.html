<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱心祝福</title>
    <style>
        /* 微信浏览器最基础的样式，不加任何复杂属性 */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #btn {
            background: #ffffff;
            color: #ff6b81;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
        }
        #container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        .item {
            position: absolute;
            width: 130px;
            height: 44px;
            background: lightpink;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 按钮直接放在body里，微信无法隐藏 -->
    <button id="btn">点击进入</button>
    <div id="container"></div>

<script>
    // 所有JS代码都写在body最后，微信不会拦截
    var btn = document.getElementById('btn');
    var container = document.getElementById('container');

    btn.onclick = function() {
        // 1. 先播放音乐（只在点击后创建）
        var bgm = new Audio('1.mp3');
        bgm.loop = true;
        bgm.volume = 0.4;
        bgm.play().catch(function(){});

        // 2. 隐藏按钮，显示动画
        btn.style.display = 'none';
        container.style.display = 'block';

        // 3. 启动爱心动画
        drawHeart();
    };

    function drawHeart() {
        container.innerHTML = '';
        var w = window.innerWidth;
        var h = window.innerHeight;
        var cx = w / 2;
        var cy = h / 2;
        var scale = Math.min(w, h) / 32;

        var points = [];
        for(var i=0; i<40; i++){
            var t = i/40 * Math.PI * 2;
            var x = 16 * Math.sin(t)**3;
            var y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
            points.push([x*scale + cx, -y*scale + cy]);
        }

        var idx = 0;
        function show() {
            if(idx >= points.length){
                setTimeout(drawHeart, 3000);
                return;
            }
            var p = points[idx];
            var div = document.createElement('div');
            div.className = 'item';
            div.style.left = (p[0] - 65) + 'px';
            div.style.top = (p[1] - 22) + 'px';
            div.style.background = ["lightpink","skyblue","lightgreen","lavender"][Math.floor(Math.random()*4)];
            div.innerText = ["少熬夜","好好学习","按时吃饭","别分心"][Math.floor(Math.random()*4)];
            container.appendChild(div);
            idx++;
            setTimeout(show, 70);
        }
        show();
    }
</script>
</body>
</html>
