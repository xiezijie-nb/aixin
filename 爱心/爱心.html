<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爱心祝福</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#fff; }

        .start {
            position:fixed;
            width:100%; height:100%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            z-index:9999;
        }

        .loading-text {
            font-size:17px;
            color:#fff;
            margin-bottom:25px;
            font-weight:bold;
        }

        .enter-btn {
            padding:18px 50px;
            font-size:18px;
            color:#fff;
            font-weight:bold;
            background:rgba(255,255,255,0.3);
            border:2px solid #fff;
            border-radius:50px;
            cursor:pointer;
            outline:none;
            -webkit-tap-highlight-color:transparent;
        }

        .main {
            width:100%; height:100%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            display:none;
            position:relative;
        }

        /* 你要的弹窗大小 —— 锁死不动 */
        .heart-box {
            position:absolute;
            width:150px;
            height:50px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            font-weight:bold;
            color:#222;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
            z-index:10;
        }

        audio { display:none; }
    </style>
</head>
<body>

<audio id="bgm" loop preload="auto">
    <source src="6.mp3" type="audio/mpeg">
</audio>

<div class="start">
    <div class="loading-text">加载中，请稍候...</div>
    <button class="enter-btn" disabled>加载中...</button>
</div>

<div class="main"></div>

<script>
const bgm = document.getElementById('bgm');
const startPage = document.querySelector('.start');
const enterBtn = document.querySelector('.enter-btn');
const loadingText = document.querySelector('.loading-text');
const main = document.querySelector('.main');

// 音频预加载 —— 3分钟也能流畅加载
bgm.load();

bgm.oncanplaythrough = function() {
    enterBtn.disabled = false;
    enterBtn.innerText = '点击进入';
    loadingText.innerText = '加载完成，欢迎访问';
};

const tips = ['少熬夜','好好学习','按时吃饭','别分心','你最棒','加油','记得想我','平安喜乐','万事顺遂','温柔以待'];
const colors = ['lightpink','skyblue','lightgreen','lavender','lightyellow','plum'];

enterBtn.onclick = function() {
    bgm.volume = 0.4;
    bgm.play().catch(()=>{});
    startPage.style.display = 'none';
    main.style.display = 'block';
    startAnim();
};
enterBtn.ontouchstart = function(){};

function startAnim() {
    main.innerHTML = '';
    const w = window.innerWidth;
    const h = window.innerHeight;
    const cx = w / 2;
    const cy = h / 2;
    const scale = Math.min(w, h) / 28;

    const points = [];
    for(let i=0; i<45; i++) {
        const t = i / 45 * Math.PI * 2;
        const x = 16 * Math.sin(t)**3;
        const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        points.push([x*scale + cx, -y*scale + cy]);
    }

    let idx = 0;
    function show() {
        if(idx >= points.length) {
            setTimeout(startAnim, 3000);
            return;
        }
        const [x, y] = points[idx];
        const div = document.createElement('div');
        div.className = 'heart-box';
        div.style.left = x - 75 + 'px';
        div.style.top = y - 25 + 'px';
        div.style.background = colors[Math.floor(Math.random() * colors.length)];
        div.innerText = tips[Math.floor(Math.random() * tips.length)];
        main.appendChild(div);
        idx++;
        setTimeout(show, 70);
    }
    show();
}
</script>
</body>
</html>
