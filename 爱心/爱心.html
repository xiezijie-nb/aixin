<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>爱心祝福</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        html,body {
            width:100%;height:100%;
            background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fecfef,#a8edea);
            overflow:hidden;
        }
        #enterBtn {
            position:fixed;
            top:50%;left:50%;
            transform:translate(-50%,-50%);
            padding:16px 40px;
            background:#fff;
            color:#ff6b81;
            border:none;border-radius:50px;
            font-size:18px;font-weight:bold;
            z-index:9999;
        }
        #heartContainer {
            width:100%;height:100%;
            position:fixed;top:0;left:0;
            display:none;
        }
        .item {
            position:absolute;
            width:130px;height:44px;
            display:flex;align-items:center;justify-content:center;
            font-size:15px;font-weight:bold;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <button id="enterBtn">点击进入</button>
    <div id="heartContainer"></div>

<script>
const enterBtn = document.getElementById('enterBtn');
const heartContainer = document.getElementById('heartContainer');

const texts = ["少熬夜","好好学习","按时吃饭","别分心","你最棒","加油","记得想我","平安喜乐"];
const colors = ["lightpink","skyblue","lightgreen","lavender","lightyellow","plum"];

enterBtn.onclick = function(){
    // 点击后再创建音乐，不阻塞页面，微信QQ绝不卡死
    let bgm = new Audio("1.mp3");
    bgm.loop = true;
    bgm.volume = 0.4;
    bgm.play().catch(e=>{});

    enterBtn.style.display = 'none';
    heartContainer.style.display = 'block';
    drawHeart();
}

function drawHeart(){
    heartContainer.innerHTML = '';
    let w = innerWidth,h = innerHeight;
    let cx = w/2, cy = h/2;
    let scale = Math.min(w,h)/32;
    let points = [];

    for(let i=0;i<40;i++){
        let t = i/40*Math.PI*2;
        let x = 16 * Math.sin(t)**3;
        let y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        points.push([x*scale+cx, -y*scale+cy]);
    }

    let idx = 0;
    function show(){
        if(idx >= points.length){
            setTimeout(drawHeart,3000);
            return;
        }
        let p = points[idx];
        let d = document.createElement('div');
        d.className = 'item';
        d.style.left = (p[0]-65)+'px';
        d.style.top = (p[1]-22)+'px';
        d.style.background = colors[Math.floor(Math.random()*colors.length)];
        d.innerText = texts[Math.floor(Math.random()*texts.length)];
        heartContainer.appendChild(d);
        idx++;
        setTimeout(show,70);
    }
    show();
}
</script>
</body>
</html>
