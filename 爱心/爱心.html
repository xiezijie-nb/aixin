<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱心祝福</title>
    <style>
        /* 微信浏览器的强制重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            overflow: hidden;
        }
        /* 强制按钮可见的终极写法 */
        #btn {
            /* 1. 强制置顶，微信无法隐藏 */
            position: fixed !important;
            z-index: 999999 !important;
            /* 2. 强制居中 */
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            /* 3. 超大点击区域，防止误触不到 */
            padding: 16px 40px !important;
            /* 4. 高对比度颜色，微信无法把它“融掉” */
            background: #ffffff !important;
            color: #333333 !important;
            border: 2px solid #ff6b81 !important;
            border-radius: 30px !important;
            font-size: 18px !important;
            /* 5. 强制可点击 */
            display: block !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            visibility: visible !important;
        }
        #heartContainer {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: none;
        }
        .item {
            position: absolute;
            width: 130px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }
        #bgm {
            display: none;
            preload: auto;
        }
    </style>
</head>
<body>
    <!-- 预加载音频，微信里能一次加载完成 -->
    <audio id="bgm" loop preload="auto">
        <source src="1.mp3" type="audio/mpeg">
    

    <!-- 微信里100%能看到的按钮 -->
    <button id="btn">点击进入</button>

    <div id="heartContainer"></div>

<script>
    const btn = document.getElementById('btn');
    const heartContainer = document.getElementById('heartContainer');
    const bgm = document.getElementById('bgm');

    const texts = ["少熬夜","好好学习","按时吃饭","别分心","你最棒","加油","记得想我","平安喜乐"];
    const colors = ["lightpink","skyblue","lightgreen","lavender","lightyellow","plum"];

    // 点击后播放，完全避开微信自动播放限制
    btn.onclick = function() {
        bgm.volume = 0.4;
        bgm.play().catch(() => {});

        btn.style.display = 'none';
        heartContainer.style.display = 'block';
        drawHeart();
    };

    function drawHeart() {
        heartContainer.innerHTML = '';
        const w = window.innerWidth;
        const h = window.innerHeight;
        const cx = w / 2;
        const cy = h / 2;
        const scale = Math.min(w, h) / 32;

        let points = [];
        for(let i=0; i<40; i++){
            const t = i/40 * Math.PI * 2;
            const x = 16 * Math.sin(t)**3;
            const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
            points.push([x*scale + cx, -y*scale + cy]);
        }

        let idx = 0;
        function show() {
            if(idx >= points.length){
                setTimeout(drawHeart, 3000);
                return;
            }
            const p = points[idx];
            const div = document.createElement('div');
            div.className = 'item';
            div.style.left = (p[0] - 65) + 'px';
            div.style.top = (p[1] - 22) + 'px';
            div.style.background = colors[Math.floor(Math.random() * colors.length)];
            div.innerText = texts[Math.floor(Math.random() * texts.length)];
            heartContainer.appendChild(div);
            idx++;
            setTimeout(show, 70);
        }
        show();
    }
</script>
</body>
</html>
