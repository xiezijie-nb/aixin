<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>爱心提示</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { width:100vw; height:100vh; overflow:hidden; }

        .start {
            position:fixed; left:0; top:0; width:100%; height:100%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            display:flex; align-items:center; justify-content:center; z-index:9999;
            flex-direction: column; gap:30px;
        }
        .btn {
            padding:15px 40px; font-size:18px; color:#fff;
            background:rgba(255,255,255,0.3); border:2px solid #fff;
            border-radius:50px; cursor:pointer;
        }
        .loading-tip{
            font-size:16px;
            color:#fff;
            display:none;
        }

        .main {
            width:100%; height:100%; position:relative;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            display:none;
        }

        .box {
            position:absolute;
            width: 150px;
            height: 50px;
            display:flex; align-items:center; justify-content:center;
            font-size: 18px;
            font-weight:bold; color:#222;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

        audio { display:none; }
    </style>
</head>
<body>

<audio id="bgm" loop preload="auto">
    <source src="6.mp3">


<div class="start">
    <button class="btn">点击进入</button>
    <div class="loading-tip">资源加载中，请稍候...</div>
</div>
<div class="main"></div>

<script>
const start = document.querySelector('.start');
const main = document.querySelector('.main');
const btn = document.querySelector('.btn');
const bgm = document.getElementById('bgm');
const loadingTip = document.querySelector('.loading-tip');

bgm.load();

const tips = ['少熬夜','好好学习','按时吃饭','别分心','你最棒','加油','记得想我','平安喜乐','万事顺遂'];
const colors = ['lightpink','skyblue','lightgreen','lavender','lightyellow','plum'];

btn.onclick = function(){
    btn.style.display = 'none';
    loadingTip.style.display = 'block';
    setTimeout(()=>{
        start.style.display = 'none';
        main.style.display = 'block';
        bgm.volume = 0.4;
        bgm.play().catch(()=>{});
        play();
    },600);
};

function play(){
    main.innerHTML = '';
    const w = innerWidth;
    const h = innerHeight;
    const cx = w / 2;
    const cy = h / 2;
    const scale = Math.min(w, h) / 28;

    const points = [];
    for(let i=0;i<45;i++){
        const t = i/45 * Math.PI*2;
        const x = 16 * Math.sin(t)**3;
        const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        points.push([x*scale + cx, -y*scale + cy]);
    }

    let idx = 0;
    function show(){
        if(idx >= points.length){
            setTimeout(play, 3000);
            return;
        }
        const [x, y] = points[idx];
        const div = document.createElement('div');
        div.className = 'box';
        div.style.left = x - 75 + 'px';
        div.style.top  = y - 25 + 'px';
        div.style.background = colors[Math.random()*colors.length|0];
        div.innerText = tips[Math.random()*tips.length|0];
        main.appendChild(div);
        idx++;
        setTimeout(show, 70);
    }
    show();
}
</script>
</body>
</html>
