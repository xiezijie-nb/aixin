<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱心祝福</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef, #a8edea);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #enterBtn {
            padding: 15px 40px;
            font-size: 18px;
            color: #fff;
            background: rgba(255,255,255,0.3);
            border: 2px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            display: block !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        #heartContainer {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: none;
        }
        .item {
            position: absolute;
            width: 130px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }
        #bgm {
            display: none;
            preload: auto;
        }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="1.mp3" type="audio/mpeg">
    

    <button id="enterBtn">点击进入</button>
    <div id="heartContainer"></div>

<script>
    const enterBtn = document.getElementById('enterBtn');
    const heartContainer = document.getElementById('heartContainer');
    const bgm = document.getElementById('bgm');

    const texts = ["少熬夜","好好学习","按时吃饭","别分心","你最棒","加油","记得想我","平安喜乐"];
    const colors = ["lightpink","skyblue","lightgreen","lavender","lightyellow","plum"];

    enterBtn.onclick = function() {
        bgm.volume = 0.4;
        bgm.play().catch(() => {});

        enterBtn.style.display = 'none';
        heartContainer.style.display = 'block';
        drawHeart();
    };

    function drawHeart() {
        heartContainer.innerHTML = '';
        const w = window.innerWidth;
        const h = window.innerHeight;
        const cx = w / 2;
        const cy = h / 2;
        const scale = Math.min(w, h) / 32;

        let points = [];
        for(let i=0; i<40; i++){
            const t = i/40 * Math.PI * 2;
            const x = 16 * Math.sin(t)**3;
            const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
            points.push([x*scale + cx, -y*scale + cy]);
        }

        let idx = 0;
        function show() {
            if(idx >= points.length){
                setTimeout(drawHeart, 3000);
                return;
            }
            const p = points[idx];
            const div = document.createElement('div');
            div.className = 'item';
            div.style.left = (p[0] - 65) + 'px';
            div.style.top = (p[1] - 22) + 'px';
            div.style.background = colors[Math.floor(Math.random() * colors.length)];
            div.innerText = texts[Math.floor(Math.random() * texts.length)];
            heartContainer.appendChild(div);
            idx++;
            setTimeout(show, 70);
        }
        show();
    }
</script>
</body>
</html>
